name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff — errors only, no warnings tier)
    # On the self-hosted iceland runner (labels `self-hosted` + `iceland`, the box that runs the
    # health probes): the account's spending limit is 0, so a GitHub-hosted job does not start at
    # all until the cycle resets (2026-12-01). The matrix below stays hosted on purpose — it is
    # the cross-platform claim — and the hosted dead-man's switch (source-health-fallback.yml)
    # stays hosted on purpose too: a failover must not run on the box it watches. Both wait for
    # the reset; this job does not.
    #
    # This repository is public, so a pull request from a fork would otherwise check out and run
    # arbitrary code on the box, credentials and all. Same-repo branches and pushes still run here;
    # a fork's lint waits for the hosted lane rather than executing on the runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, iceland]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: Fast tests (${{ matrix.os }}, ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The toolkit is plain Python; this matrix is what backs that claim.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Tier 0 (core) must pass on its own; the maps tier is the heavy opt-in.
        # See AGENTS.md "Requirement tiers".
        tier: [core, maps]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked ${{ matrix.tier == 'maps' && '--group maps' || '' }}

      # Deselects the `slow` marker (network + browser), so this job never
      # depends on third-party service availability.
      - name: Check setup (imports, skills link)
        run: uv run python scripts/setup_check.py

      - name: Run tests
        run: uv run pytest -m "not slow"
